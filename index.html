<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>До 7 августа 2026</title>
  <meta name="description" content="Обратный отсчёт до 7 августа 2026 года 19:00">
  <meta property="og:title" content="До 7 августа 2026">
  <meta property="og:description" content="Обратный отсчёт до 7 августа 2026 года 19:00">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://via.placeholder.com/1200x630/282828/fabd2f?text=7+августа+2026">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="content">
    <p class="subtitle">7 августа 2026 · 19:00</p>
    <h1 class="title">До 7 августа осталось</h1>

    <div id="countdown">
      <div class="time-card">
        <span class="time-value" id="days">00</span>
        <span class="time-label">Дней</span>
      </div>
      <div class="time-card">
        <span class="time-value" id="hours">00</span>
        <span class="time-label">Часов</span>
      </div>
      <div class="time-card">
        <span class="time-value" id="minutes">00</span>
        <span class="time-label">Минут</span>
      </div>
      <div class="time-card">
        <span class="time-value" id="seconds">00</span>
        <span class="time-label">Секунд</span>
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress-meta">
        <span>Прогресс 2026</span>
        <span id="progress-percent">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <p class="footer-text">Ждём с нетерпением</p>
  </main>

  <script src="js/countdown.js"></script>
</body>
</html>
